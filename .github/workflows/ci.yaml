name: Tests

on: [push, pull_request]

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Build dependencies
        run: |
          rustup update stable --no-self-update
          rustup default stable
          sudo apt update
          sudo apt install -y ca-certificates libssl-dev

      - name: Compile
        run: cargo rustc -- -A warnings

      - name: Unit tests
        run: RUST_LOG=asmr=debug cargo test

  coin-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Install coin dependencies
        run: |
          rustup update stable --no-self-update
          rustup default stable
          sudo apt-get update
          # Electrum dependencies
          sudo apt-get install libsecp256k1-0 python3-setuptools python3-cryptography python3-scrypt

      - name: Pip cache
        uses: actions/cache@v2
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-electrum-4.0.2
          restore-keys: |
            ${{ runner.os }}-pip-electrum-
            ${{ runner.os }}-pip-

      - name: Setup Litecoin
        run: sudo ./ci/setup-coins/litecoin.sh

      - name: Run a Monero Regtest Node
        uses: ./.github/actions/monero

      - name: Run a Monero Wallet-RPC
        uses: ./.github/actions/monero-wallet-rpc

      - name: Setup Monero
        run: ./ci/setup-coins/monero.sh

      - name: Run Litecoin-Monero swap tests
        run: RUST_LOG=asmr=debug cargo test --features test_litecoin_node,test_monero_node -- ltc_and_xmr --nocapture
