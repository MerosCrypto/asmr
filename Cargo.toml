[package]
name = "asmr"
version = "0.1.0"
authors = ["Luke Parker <lukeparker5132@gmail.com>", "Lee Bousfield <ljbousfield@gmail.com>"]
edition = "2018"

[dependencies]
async-trait = "0.1"
lazy_static = "1"
hex-literal = "0.4"
hex = "0.4"
enum-utils = "0.1"
enum_dispatch = "0.3"
anyhow = "1"
futures = "0.3"
tokio = { version = "0.2", features = ["full"] }
log = "0.4"
env_logger = "0.7"
structopt = "0.3"
rand = { version = "0.7", features = ["std"] }
rand_8 = { package = "rand", version = "0.8", features = ["std"] }
digest = "0.9"
sha2 = "0.9"
blake2 = "0.9"
secp256kfun = { version = "0.6", default-features = false, features = ["serde"] }
curve25519-dalek = { version = "3", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
derive_more = "0.99"
bincode = "1"
serde_json = "1"
reqwest = { version = "0.10", features = ["json"] }
bitcoin = { git = "https://github.com/rust-litecoin/rust-litecoin", branch = "ltc" }
nanocurrency-types = "0.3"
num_cpus = "1"
monero = "0.12"
digest_auth = "0.2"

[features]
no_confs = []
test_litecoin_node = []
test_nano_node = []
test_monero_node = []

# Always optimize dependencies
[profile.dev.package."*"]
opt-level = 3

[patch.crates-io]
# https://github.com/rust-lang-nursery/lazy-static.rs/issues/201
lazy_static = { git = "https://github.com/rust-lang-nursery/lazy-static.rs", rev = "5735630d46572f1e5377c8f2ba0f79d18f53b10c" }
subtle-ng = { path = "./subtle-ng" }
